name: Setup
description: Set up the project environment

inputs:
  project-name:
    description: Name of the project
    required: true
  node-version:
    description: Node version to use
    default: "20"

outputs:
  node_version:
    description: The resolved node version
    value: ${{ steps.run.outputs.node_version }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      working-directory: ${{ github.action_path }}
      # Untrusted inputs travel through env, never interpolated into the run: text (see actions/lint).
      env:
        SETUP_PROJECT_NAME: ${{ inputs.project-name }}
        SETUP_NODE_VERSION: ${{ inputs.node-version }}
      run: bazelisk run //actions/setup --
        --project-name="$SETUP_PROJECT_NAME"
        --node-version="$SETUP_NODE_VERSION"
