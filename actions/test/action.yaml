name: Test
description: Run the test suite

inputs:
  suite:
    description: Which test suite to run
    default: unit
  coverage:
    description: Enable coverage reporting
    default: "true"

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ github.action_path }}
      # Untrusted inputs travel through env, never interpolated into the run: text (see actions/lint).
      env:
        TEST_SUITE: ${{ inputs.suite }}
        TEST_COVERAGE: ${{ inputs.coverage }}
      run: bazelisk run //actions/test --
        --suite="$TEST_SUITE"
        --coverage="$TEST_COVERAGE"
